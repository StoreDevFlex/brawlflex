<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flex - Brawl Stars Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      color: #fff;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

  <!-- 1. BÖLÜM: ÜST SAFE ŞERİDİ (Uygulama açılınca en üstte direkt görünür) -->
  <div class="w-full bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl shadow-2xl backdrop-blur-md flex items-center justify-between mb-4">
    <div class="flex items-center space-x-2.5">
      <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-lg font-black text-[10px] tracking-wider">SAFE</span>
      <span class="text-[11px] font-bold text-slate-300">Durum: <span class="text-emerald-400">Aktif</span></span>
    </div>
    <div id="liveResult" class="text-right">
      <p class="text-[11px] font-black text-indigo-400">Öneri: <span id="recommendedHero" class="text-white">Rakip Seç</span></p>
      <p class="text-[9px] text-slate-400">Win-Rate: <span id="winRateText" class="text-emerald-400 font-bold">-</span></p>
    </div>
  </div>

  <!-- 2. BÖLÜM: ORTA KISIM (Harita ve Rakip Yazma Paneli) -->
  <div class="max-w-md mx-auto w-full bg-slate-900/80 border border-slate-800 p-5 rounded-3xl shadow-2xl space-y-4 my-auto">
    
    <div class="text-center space-y-1">
      <div class="inline-block px-3 py-1 bg-indigo-600/20 border border-indigo-500/30 rounded-full text-[10px] font-black text-indigo-400 uppercase tracking-widest">Flex Engine v3.0</div>
      <h1 class="text-lg font-black italic tracking-wider text-white">BRAWL STARS ASİSTANI</h1>
    </div>

    <!-- Harita Seçimi -->
    <div class="space-y-1.5">
      <label class="text-[11px] font-bold text-slate-400">Oyun Haritası:</label>
      <select id="mapSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white font-bold focus:outline-none focus:border-indigo-500">
        <option value="brawl_ball">Çift Çıkmaz (Brawl Ball)</option>
        <option value="gem_grab">Elmas Kapmaca (Gem Grab)</option>
        <option value="showdown">Girdap (Showdown)</option>
        <option value="bounty">Ödül Avı (Bounty)</option>
      </select>
    </div>

    <!-- Rakip Karakter Ekleme Kutusu -->
    <div class="space-y-1.5">
      <label class="text-[11px] font-bold text-slate-400">Rakip Karakter Ekle (İsim Yaz):</label>
      <div class="flex space-x-2">
        <input type="text" id="enemyInput" placeholder="Örn: Edgar, Leon, Shelly..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        <button onclick="addEnemy()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs rounded-xl shadow-lg transition-all active:scale-95">Ekle</button>
      </div>
    </div>

    <!-- Eklenen Rakipler Listesi -->
    <div class="space-y-1.5">
      <span class="text-[11px] font-bold text-slate-400">Rakip Takım:</span>
      <div id="enemyList" class="flex flex-wrap gap-1.5 min-h-[36px] p-2 bg-slate-800/40 rounded-xl border border-slate-800">
        <span class="text-[11px] text-slate-500 italic p-0.5">Henüz rakip eklenmedi...</span>
      </div>
    </div>

    <!-- Hesapla Butonu -->
    <button onclick="calculateCounter()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl shadow-lg shadow-emerald-600/30 transition-all transform active:scale-95 flex items-center justify-center space-x-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span>EN İYİ KARAKTERİ VE AKSESUARI GÖSTER</span>
    </button>
  </div>

  <!-- 3. BÖLÜM: PROFİL İNDİR BUTONU (Sitede görünür) -->
  <div class="max-w-md mx-auto w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl mt-4 text-center">
    <p class="text-[11px] text-slate-400 mb-2">Uygulamayı ana ekrana sabitlemek için:</p>
    <button id="downloadBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs rounded-xl shadow-lg transition-all active:scale-95">
      PROFİLİ İNDİR (.mobileconfig)
    </button>
  </div>

  <!-- ALT BİLGİ -->
  <footer class="text-center text-slate-500 text-[10px] py-2">
    Flex Engine © 2026 — Güvenli & Bansız Altyapı.
  </footer>

  <script>
    let enemies = [];

    function addEnemy() {
      const input = document.getElementById('enemyInput');
      const val = input.value.trim();
      if (val && enemies.length < 3) {
        enemies.push(val);
        input.value = '';
        renderEnemies();
      }
    }

    function renderEnemies() {
      const list = document.getElementById('enemyList');
      if (enemies.length === 0) {
        list.innerHTML = '<span class="text-[11px] text-slate-500 italic p-0.5">Henüz rakip eklenmedi...</span>';
        return;
      }
      list.innerHTML = '';
      enemies.forEach((enemy, index) => {
        const tag = document.createElement('div');
        tag.className = 'flex items-center space-x-1 bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 px-2.5 py-1 rounded-lg text-[11px] font-bold';
        tag.innerHTML = `<span>${enemy}</span> <button onclick="removeEnemy(${index})" class="text-red-400 hover:text-red-300 ml-1 font-black">×</button>`;
        list.appendChild(tag);
      });
    }

    function removeEnemy(index) {
      enemies.splice(index, 1);
      renderEnemies();
    }

    function calculateCounter() {
      if (enemies.length === 0) {
        alert('Lütfen en az bir rakip karakter ekle!');
        return;
      }
      
      const heroElem = document.getElementById('recommendedHero');
      const winRateElem = document.getElementById('winRateText');

      if (enemies.some(e => e.toLowerCase().includes('edgar'))) {
        heroElem.innerText = 'Shelly (Şok Stun Aksesuarı)';
        winRateElem.innerText = '%96.4 Win-Rate';
      } else {
        heroElem.innerText = 'Colt (Seri Atış + Hız)';
        winRateElem.innerText = '%91.8 Win-Rate';
      }
    }

    // .mobileconfig Profil İndirme Tetikleyicisi
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('downloadBtn');
      if (btn) {
        btn.addEventListener('click', function() {
          const liveSiteURL = window.location.href;
          const configXML = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadDisplayName</key>
    <string>Flex Brawl Stars Companion</string>
    <key>PayloadIdentifier</key>
    <string>com.flex.brawlstars</string>
    <key>PayloadOrganization</key>
    <string>Flex Engine</string>
    <key>PayloadDescription</key>
    <string>Flex Brawl Stars Live Companion App</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>A1B2C3D4-E5F6-7890-ABCD-EF0123456789</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
    <key>PayloadContent</key>
    <array>
        <dict>
            <key>FullScreen</key>
            <true/>
            <key>Label</key>
            <string>Flex Brawl Stars</string>
            <key>PayloadDisplayName</key>
            <string>Flex Brawl Stars</string>
            <key>PayloadIdentifier</key>
            <string>com.flex.brawlstars.webclip</string>
            <key>PayloadType</key>
            <string>com.apple.webClip.managed</string>
            <key>PayloadUUID</key>
            <string>12345678-ABCD-EF01-2345-6789ABCDEF01</string>
            <key>PayloadVersion</key>
            <integer>1</integer>
            <key>URL</key>
            <string>${liveSiteURL}</string>
            <key>IsRemovable</key>
            <true/>
        </dict>
    </array>
</dict>
</plist>`;

          const blob = new Blob([configXML], { type: 'application/x-apple-aspen-config;charset=utf-8' });
          const blobUrl = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = blobUrl;
          downloadLink.setAttribute('download', 'FlexBrawlStars.mobileconfig');
          document.body.appendChild(downloadLink);
          downloadLink.click();
          setTimeout(() => {
            document.body.removeChild(downloadLink);
            window.URL.revokeObjectURL(blobUrl);
          }, 100);
        });
      }
    });
  </script>
</body>
</html>
